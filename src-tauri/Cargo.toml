[package]
name = "zero"
# Not the app's version, and deliberately a number nobody could mistake for it:
# tauri.conf.json reads that from package.json, so this crate's is unused and
# would only be a third copy to forget to bump.
version = "0.0.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "zero_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9.0"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"
# macOS 26 Liquid Glass behind the webview; safe no-op everywhere else
tauri-plugin-liquid-glass = "0.1"

# WKWebView renders at 60fps even on a 120Hz ProMotion panel; unlocking it
# means talking to WebKit's private feature flags directly (see high_refresh.rs)
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
# NSRect/NSPoint, for moving the traffic lights onto the top bar's axis
# (traffic_lights.rs). Already in the tree — tao and wry build it — so this
# only names it.
objc2-core-foundation = { version = "0.3", features = ["objc2"] }
# the ObjC block the frame-change observer is registered with, same story
block2 = "0.6"

